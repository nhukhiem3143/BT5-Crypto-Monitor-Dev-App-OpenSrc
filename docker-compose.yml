# =============================================================================
# CRYPTO MONITOR & ALERT SYSTEM
# =============================================================================

networks:
  crypto_net:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
  grafana_data:
    driver: local
  nodered_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # NGINX - Reverse Proxy & Static File Server
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      flask-api:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
      grafana:                             # <--- THÊM 3 DÒNG NÀY VÀO
        condition: service_healthy
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FRONTEND - Build Stage (React + Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_frontend_build
    volumes:
      - ./frontend/dist:/app/dist
    networks:
      - crypto_net
    restart: "no"

  # ---------------------------------------------------------------------------
  # FLASK API - Backend REST API
  # ---------------------------------------------------------------------------
  flask-api:
    build:
      context: ./flask-api
      dockerfile: Dockerfile
    container_name: crypto_flask_api
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - INFLUXDB_HOST=http://influxdb:8086
    depends_on:
      mariadb:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MARIADB - Relational Database (realtime prices)
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: crypto_mariadb
    restart: unless-stopped
    expose:
      - "3306"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: crypto_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - crypto_net

  # ---------------------------------------------------------------------------
  # INFLUXDB - Time-Series Database (price history)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: crypto_influxdb
    restart: unless-stopped

    ports:
      - "8086:8086"

    env_file:
      - .env

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}

    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

    networks:
      - crypto_net

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # GRAFANA - Visualization & Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: crypto_grafana
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://192.168.100.2:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # NODE-RED - Data Pipeline & Alert Engine
  # ---------------------------------------------------------------------------
  nodered:
    image: nodered/node-red:3.1.9-18
    container_name: crypto_nodered
    restart: unless-stopped
    expose:
      - "1880"
    ports:
      - "1880:1880"
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NODE_RED_CREDENTIAL_SECRET=nodered-secret-key
    volumes:
      - ./nodered:/data
    depends_on:
      mariadb:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - crypto_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # CLOUDFLARED - Cloudflare Tunnel
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crypto_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - crypto_net